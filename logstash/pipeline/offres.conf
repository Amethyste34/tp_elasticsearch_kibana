# Atelier 1 : recharger data/offres.ndjson dans l'index "offres" du TP.
#
# Kit reçu déjà rempli (sans TODO) : les repères TODO 1 à 6 ci-dessous sont
# rajoutés pour l'analyse, d'après l'énoncé (Readme.md, exercices 1.1 et 1.3).
# Le code est celui du prof, inchangé ; seuls les commentaires sont de nous.
#
# Trajet d'une offre : fichier -> input (lecture) -> filter (nettoyage) -> output (Elasticsearch)

input {
  file {
    # Chemin VU DE L'INTÉRIEUR du conteneur : l'override monte ./data sur /data,
    # en lecture seule (":ro") -> Logstash ne peut pas abîmer nos données.
    path => "/data/offres.ndjson"

    # TODO 1 — lire le fichier en entier, une seule fois.
    #   "read" : lit tout le fichier puis s'arrête (fichier complet, déposé une fois).
    #   "tail" (défaut) : guette la fin du fichier et attend de nouvelles lignes
    #   (fait pour des logs écrits en continu, pas pour un export fini comme le nôtre).
    mode => "read"                                  # lecture complète, pas de suivi en continu

    # TODO 2 — une ligne = un objet JSON.
    #   Le codec "json" transforme chaque ligne en événement dont les champs sont
    #   ceux de l'objet (id, titre, ville...). Sans lui, toute la ligne finirait
    #   en texte brut dans un seul champ "message".
    codec => "json"                                 # une ligne = un objet JSON

    # TODO 3 — désactiver la mémoire de lecture (sincedb).
    #   La sincedb note jusqu'où chaque fichier a été lu, pour reprendre après
    #   un redémarrage. "/dev/null" est un « trou noir » : rien n'est retenu,
    #   donc le fichier est relu EN ENTIER à chaque démarrage. Pratique en labo,
    #   à éviter en production (on relirait tout, à chaque fois).
    sincedb_path => "/dev/null"                     # relit le fichier à chaque démarrage (labo)

    # TODO 4 — ne pas supprimer le fichier après lecture.
    #   En mode "read", l'action par défaut est "delete" : le fichier source
    #   serait EFFACÉ une fois lu. "log" se contente d'écrire son nom dans
    #   file_completed_log_path (dans le volume de Logstash, pas dans ./data).
    #   NB : ./data est monté en lecture seule (":ro") : un "delete" échouerait
    #   sans doute ici, mais on ne compte pas sur ce hasard pour protéger le fichier.
    file_completed_action => "log"                  # défaut "delete" : supprimerait le fichier
    file_completed_log_path => "/usr/share/logstash/data/offres_lus.log"
  }
}

filter {
  # TODO 6 (exercice 1.3) — retirer les champs que l'index refuse.
  #   Logstash ajoute de lui-même @timestamp, @version, event, log, host
  #   (vu à l'exercice 0). Or le mapping de "offres" est "dynamic": "strict"
  #   (TP1, ex. 1.4) : tout champ inconnu fait REJETER le document entier.
  #   On les supprime ici plutôt que d'assouplir le mapping : l'index garde
  #   un schéma strict, et ces champs n'ont aucun sens pour une offre d'emploi.
  # Champs ajoutés par Logstash, refusés par le mapping "dynamic": "strict" de l'index
  mutate {
    remove_field => ["@timestamp", "@version", "event", "log", "host"]
  }
}

output {
  elasticsearch {
    # Connexion : valeurs lues dans les variables d'environnement du conteneur,
    # remplies par l'override (ES_PASSWORD = ${LOGSTASH_INTERNAL_PASSWORD} du .env).
    # Aucun secret écrit dans ce fichier, qui est versionné dans Git.
    hosts => ["${ES_HOSTS}"]
    user => "${ES_USER}"
    password => "${ES_PASSWORD}"

    # TODO 5 — où et comment écrire.
    #   index         : l'index cible, celui du TP1.
    #   document_id   : l'_id du document = le champ "id" de l'offre (ex. OFF-00002).
    #                   Relire le fichier REMPLACE les mêmes documents au lieu d'en
    #                   créer de nouveaux : pas de doublon (ingestion idempotente).
    #                   Seul le _version augmente (+1 à chaque relecture).
    #   action        : "index" = créer, ou remplacer si l'_id existe déjà.
    #   data_stream   : "false" -> "offres" est un index classique, pas un data stream
    #                   (un data stream est fait pour des événements horodatés en ajout seul).
    #   manage_template : false -> Logstash n'installe pas son propre modèle d'index ;
    #                   le mapping strict existe déjà. D'où l'obligation que l'index
    #                   "offres" existe AVANT le premier démarrage de Logstash.
    index => "offres"
    document_id => "%{id}"                          # _id métier : ingestion idempotente
    action => "index"
    data_stream => "false"
    manage_template => false                        # le mapping existe déjà (TP, exercice 1.4)
  }
}
